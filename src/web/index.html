<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="农历生日日历生成器 - 将家人的农历生日转为公历，一键导入手机日历">
  <meta name="theme-color" content="#0088FF">
  <title>农历生日日历生成器</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/solarlunar@3.1.0/dist/solarlunar.min.js"></script>
  <script>
    if (typeof window.solarLunar === 'undefined') {
      document.write('<script src="vendor/solarlunar.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>农历生日日历生成器</h1>
      <p class="subtitle">将家人的农历生日转为公历，一键导入手机日历，再也不怕忘记生日</p>
    </header>

    <div id="wechat-tip" class="wechat-tip" style="display: none;">
      <p>请在浏览器中打开此页面以获得完整功能</p>
      <button id="copy-link-btn" class="btn btn-secondary btn-small">复制链接</button>
    </div>

    <main class="main">
      <section class="section">
        <div class="section-header">
          <h2>家人列表</h2>
          <button id="add-member-btn" class="btn btn-primary btn-small">+ 添加家人</button>
        </div>
        <div id="members-list" class="members-list"></div>
      </section>

      <section class="section">
        <h2>设置</h2>
        <div class="settings-grid">
          <div class="form-group">
            <label for="year-start">起始年份</label>
            <select id="year-start" class="form-control"></select>
          </div>
          <div class="form-group">
            <label for="year-end">结束年份</label>
            <select id="year-end" class="form-control"></select>
          </div>
          <div class="form-group">
            <label for="calendar-name">日历名称</label>
            <input type="text" id="calendar-name" class="form-control" value="家庭农历生日" placeholder="家庭农历生日">
          </div>
        </div>
      </section>

      <section class="section">
        <h2>预览</h2>
        <div id="preview-container" class="preview-container">
          <p class="empty-state">添加家人后，转换结果将在这里显示</p>
        </div>
      </section>

      <div class="actions">
        <button id="download-btn" class="btn btn-primary btn-large" disabled>下载 .ics 日历文件</button>
      </div>
    </main>

    <div id="import-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>导入日历指引</h3>
          <button class="modal-close" id="close-modal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="guide-section">
            <h4>iPhone / iPad</h4>
            <ol>
              <li>点击下载的 .ics 文件</li>
              <li>选择"添加到日历"</li>
              <li>确认添加</li>
            </ol>
          </div>
          <div class="guide-section">
            <h4>Mac</h4>
            <ol>
              <li>双击下载的 .ics 文件</li>
              <li>日历应用会自动打开并导入</li>
            </ol>
          </div>
          <div class="guide-section">
            <h4>Android</h4>
            <ol>
              <li>打开下载的 .ics 文件</li>
              <li>选择用"日历"应用打开</li>
              <li>确认导入</li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>所有数据仅保存在您的浏览器本地，不会上传至任何服务器</p>
      <p><a href="https://github.com/susususutie/lunarday" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
