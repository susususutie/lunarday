name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup vp
        uses: voidzero-dev/setup-vp@v2
        with:
          node-version-file: '.node-version'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm publish --access public
